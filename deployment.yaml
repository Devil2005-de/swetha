apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-system
  template:
    metadata:
      labels:
        app: library-system
    spec:
      containers:
      - name: library-app
        image: your-dockerhub/library-management:latest   # Replace with your Docker Hub username
        ports:
        - containerPort: 8080    # Not used by CLI, but kept for convention
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: library-service
spec:
  type: NodePort
  selector:
    app: library-system
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30084